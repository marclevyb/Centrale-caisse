<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a08">
<title>Centrale Caisse</title>
<style>
:root{--bg:#f3f1fa;--card:#fff;--c2:#f0edfb;--tx:#17142b;--mut:#74708f;--ac:#6d3df5;--ac2:#b14dff;--ok:#12a150;--ko:#e5483c;--wa:#e8930c;--bd:#e4e0f2;--sh:0 4px 18px rgba(60,40,140,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a08;--card:#1a1630;--c2:#241f42;--tx:#f1effb;--mut:#9b97bd;--ac:#9b7bff;--ac2:#d06bff;--ok:#3ddc84;--ko:#ff6b5f;--wa:#ffb547;--bd:#2c2749;--sh:0 4px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0b0a08;--card:#1a1630;--c2:#241f42;--tx:#f1effb;--mut:#9b97bd;--ac:#9b7bff;--ac2:#d06bff;--ok:#3ddc84;--ko:#ff6b5f;--wa:#ffb547;--bd:#2c2749;--sh:0 4px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Inter,sans-serif;max-width:640px;margin:auto;padding:0 14px 110px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 8px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.3px}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;font-style:normal;font-size:17px}
#st{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:5px}#st:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:18px 2px 8px;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.hero{background:linear-gradient(135deg,#5b2de0,#a23df0);color:#fff;border:0}
.hero small{opacity:.8}.hero .big{font-size:32px;font-weight:800;letter-spacing:-1px;margin:2px 0 12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3>div{background:rgba(255,255,255,.16);border-radius:12px;padding:8px 10px}.g3 b{display:block;font-size:15px}.g3 small{font-size:11px}
.it{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--bd);margin-bottom:8px}
.it .dot{width:10px;height:10px;border-radius:50%;flex:none}.it .mid{flex:1;min-width:0}.it .r{text-align:right}
.m{color:var(--mut);font-size:12px}.ok{color:var(--ok)}.ko{color:var(--ko)}.wa{color:var(--wa)}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--c2)}
.chip.ok{background:rgba(18,161,80,.14)}.chip.ko{background:rgba(229,72,60,.15)}.chip.wa{background:rgba(232,147,12,.16)}
.seg{display:flex;background:var(--c2);border-radius:12px;padding:3px;margin:6px 0 12px}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:10px;font:600 14px inherit}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.pn{font-weight:700;font-size:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sg>div{background:var(--c2);border-radius:12px;padding:8px 6px;text-align:center}.sg label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px;font-weight:600}
.sp{display:flex;align-items:center;justify-content:center;gap:2px}
.sp button{width:32px;height:36px;border:0;border-radius:9px;background:var(--card);color:var(--ac);font:700 20px inherit;box-shadow:var(--sh)}
.sp input{width:38px;text-align:center;border:0;background:none;font:700 17px inherit;color:var(--tx);padding:0}
input,textarea{background:var(--c2);color:var(--tx);border:1px solid transparent;border-radius:12px;padding:12px;font:inherit;width:100%}
input:focus,textarea:focus{outline:2px solid var(--ac);background:var(--card)}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:14px;font:700 15px inherit;width:100%;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));margin-top:6px}
.btn.s{background:var(--c2);color:var(--tx)}.btn.d{background:rgba(229,72,60,.15);color:var(--ko)}
.cnt{display:flex;gap:8px;align-items:center;margin-top:10px}.cnt input{text-align:center;font-weight:700;padding:9px}
.kpi{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}.kpi:last-of-type{border:0}
.bar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));max-width:640px;margin:auto;padding:0 14px}
.bar>div{background:var(--tx);color:var(--bg);border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.bar button{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:9px 14px;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;max-width:640px;margin:auto}
nav button{flex:1;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px inherit;padding:6px}
nav button.on{color:var(--ac)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;transition:.3s;z-index:9}#toast.on{transform:translate(-50%,0)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}.empty b{display:block;font-size:34px}
:root{--bg:#fff;--card:#fff;--c2:#f2f5fa;--tx:#243049;--mut:#78839a;--ac:#2d6cdf;--ac2:#2d6cdf;--ok:#12a150;--ko:#e5483c;--wa:#f39200;--bd:#e3e8f0;--sh:0 2px 10px rgba(30,50,90,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2b;--card:#1b2538;--c2:#243049;--tx:#eef2fa;--mut:#9aa6bd;--ac:#5b95ff;--ac2:#5b95ff;--ok:#3ddc84;--ko:#ff6b5f;--wa:#ffb547;--bd:#2e3b55;--sh:0 2px 10px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#121a2b;--card:#1b2538;--c2:#243049;--tx:#eef2fa;--mut:#9aa6bd;--ac:#5b95ff;--ac2:#5b95ff;--ok:#3ddc84;--ko:#ff6b5f;--wa:#ffb547;--bd:#2e3b55;--sh:0 2px 10px rgba(0,0,0,.35)}
body{max-width:760px;padding-bottom:100px}
header{border-bottom:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;left:auto;right:auto;max-width:none;margin:0 -14px 12px;padding:0 14px;flex-direction:row;overflow-x:auto;border-top:0;border-bottom:1px solid var(--bd);background:var(--bg);z-index:5}
nav button{flex:none;flex-direction:row;padding:13px 12px;font:700 12px inherit;letter-spacing:.6px;text-transform:uppercase;border-bottom:3px solid transparent;border-radius:0}
nav button.on{border-bottom-color:var(--ac);color:var(--ac)}
.bar{bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:760px}
.hr{text-align:center;padding:22px 6px 16px}.hr h1{font-size:25px;line-height:1.2;margin:0 0 10px;font-weight:800}.hr p{color:var(--mut);margin:0 auto 18px;max-width:500px}
.cta{background:#f39200;color:#fff;border:0;border-radius:99px;padding:14px 26px;font:800 14px inherit;letter-spacing:.5px;box-shadow:0 6px 16px rgba(243,146,0,.35)}
.tri,.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:10px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.tri .card{text-align:center;margin:0}.tri b{font-size:30px}.tri h3{margin:6px 0;font-size:16px;color:var(--ac)}.tri p{margin:0;color:var(--mut);font-size:13px}
.card .g3>div{background:var(--c2)}.card .g3{margin-top:8px}
.k4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.k4>div{background:var(--c2);border-radius:12px;padding:10px}.k4 small{color:var(--mut);display:block;font-size:11px}.k4 b{font-size:18px}
.lg{font-size:12px;color:var(--mut);margin:4px 0}.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin:0 4px 0 8px}
.pb{height:8px;border-radius:9px;background:var(--c2);overflow:hidden;margin-top:4px}.pb i{display:block;height:100%}

.btn{color:#1a1203;background:linear-gradient(135deg,#c99412,#f6d365)}.btn.s{background:var(--c2);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:rgba(255,77,61,.14);color:var(--ko)}
.cta{background:linear-gradient(135deg,#a50d24,#e11d38);box-shadow:0 6px 18px rgba(200,16,46,.4)}
.hr h1{background:linear-gradient(90deg,#c99412,#f6d365,#c99412);-webkit-background-clip:text;background-clip:text;color:transparent}
.bar>div{background:var(--c2);color:var(--tx);border:1px solid var(--ac)}.bar button{color:#1a1203}
.logo span{color:var(--ac2)}.logo img{background:none;border:0;border-radius:0;width:46px;height:46px;filter:drop-shadow(0 0 6px rgba(224,177,58,.4))}
.bl{background:none;box-shadow:none;border-radius:0;width:180px;height:180px;filter:drop-shadow(0 0 18px rgba(224,177,58,.35))}
.card,.it{border-color:var(--bd)}nav{background:var(--bg)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;margin-bottom:6px}.pt{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 6px;text-align:center;color:var(--tx);font:inherit;position:relative;min-height:88px;box-shadow:var(--sh)}.pt b{display:block;font-size:14px;margin-bottom:3px}.pt small{color:var(--mut)}.pt.k{border-color:var(--ac);background:var(--c2)}.pt:disabled{opacity:.35}.pt .bd{position:absolute;top:-7px;right:-5px;background:var(--ko);color:#fff;border-radius:99px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;font-weight:700}.pays{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.pg.big{grid-template-columns:repeat(2,1fr)}.pg.big .pt{min-height:104px;font-size:17px}.pg.big .pt b{font-size:17px}</style></head><body>

/* ---- Persistance double : localStorage + IndexedDB, brouillon auto-sauvegardé ---- */
const idb=()=>new Promise((ok,ko)=>{const r=indexedDB.open('nightcontrol',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=ko});
async function idbSet(v){try{(await idb()).transaction('k','readwrite').objectStore('k').put(v,'db')}catch(e){}}
async function idbGet(){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get('db');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
function sv(){if(U){dirty=true;pend()}db.ts=Date.now();const s=JSON.stringify(db);try{localStorage.setItem('nc',s)}catch(e){}idbSet(JSON.parse(s));
 $('#st').textContent='Enregistré '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
async function load(){let a=null;try{a=JSON.parse(localStorage.getItem('nc')||'null')}catch(e){}
 const b=await idbGet();const best=[a,b].filter(Boolean).sort((x,y)=>(y.ts||0)-(x.ts||0))[0];
 if(best)db=Object.assign(db,best);fix();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 render();if(best)sv()}
const D=()=>db.draft,L=p=>D().l[p.id]||(D().l[p.id]={v:0,o:0,c:0,f:''});
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function calc(){rederive();const d=D();let ca=0,cost=0,off=0,ecS=0,ecV=0;
 db.products.forEach(p=>{const l=L(p);ca+=l.v*p.price;cost+=(+l.v+ +l.o+ +l.c)*p.cost;off+=l.o*p.price;
  if(l.f!==''){const e=l.f-(p.stock-l.v-l.o-l.c);ecS+=e;ecV+=e*p.cost}});
 const ex=d.exp.reduce((a,x)=>a+x.a,0),att=ca-ex-(+d.mm||0)-(+d.cd||0)-(+d.cr||0),ec=d.cash===''?null:d.cash-att;
 return{ca,cost,off,ex,att,ec,ecS,ecV,marge:ca-cost-ex}}

 rederive();const T=tabsFor();if(!(T.some(t=>t[0]==tab)||(tab=='g'&&U.role=='gérant')))tab=firstTab();if(U.role!='gérant')sub='p';
 $('#nav').innerHTML=T.map(([k,t])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)">${t}</button>`).join('')+`<button onclick="api('logout',{}).then(()=>{U=null;render()})">🔒 ${esc(U.name)}</button>`;
 $('#v').innerHTML={a:vA,c:vC,m:vM,n:vN,p:vP,r:vR,t:vT,i:vHi,g:vG,s:vS,d:vD}[tab]();bar()}

function vD(){return vSet()+`<h2>Sauvegarde</h2><div class="card"><div class="m" style="margin-bottom:10px">Vos données sont enregistrées dans la base Supabase et en copie locale. Une sauvegarde manuelle reste utile.</div>

 <textarea id="bk" rows="4" readonly style="margin-top:10px;font-size:11px">${esc(JSON.stringify(db))}</textarea></div>
 <h2>Restaurer</h2><div class="card"><textarea id="im" rows="3" placeholder="Collez ici une sauvegarde…"></textarea><button class="btn s" onclick="rs($('#im').value)">Restaurer depuis le texte</button>

async function cp(){const t=JSON.stringify(db);try{await navigator.clipboard.writeText(t);toast('Sauvegarde copiée ✓')}catch(e){const a=$('#bk');a.select();toast('Sélectionné : copiez manuellement')}}
async function sh(){try{await navigator.share({title:'Sauvegarde Centrale Caisse',text:JSON.stringify(db)})}catch(e){cp()}}
function rs(t){try{const o=JSON.parse(t);if(!o.products||!o.nights)throw 0;if(!confirm('Remplacer les données actuelles ?'))return;{const us=db.users;db=Object.assign({draft:nd()},o);db.users=us}fix();lg('Restauration');sv();render();toast('Données restaurées ✓')}catch(e){toast('Sauvegarde invalide')}}
function fl(f){if(!f)return;const r=new FileReader();r.onload=()=>rs(r.result);r.readAsText(f)}
boot();
</script></body></html>
